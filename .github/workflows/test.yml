name: test
on: [push, pull_request]
jobs:
  offline-render:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: offline
      TTS_PROVIDER: offline
      VISUALS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes pipeline scripts voice
      - run: python -m pipeline make --category 2d --lang hi --format short
      - run: python -m pipeline make --category drama --lang en --format long --minutes 2
      - run: for e in simple news dark calm karaoke; do python -m pipeline make --category facts --format short --edit $e; done
      - run: docker build -t youtubeaiagent .
